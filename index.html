<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body
    style="
      font-family: sans-serif;
      max-width: 400px;
      margin: 60px auto;
      padding: 0 16px;
    "
  >
    <h2>Reset your password</h2>

    <div style="position: relative; margin-bottom: 10px">
      <input
        id="password"
        type="password"
        placeholder="New password"
        style="
          width: 100%;
          padding: 10px;
          padding-right: 60px;
          box-sizing: border-box;
        "
      />
      <button
        id="toggle-password"
        type="button"
        style="
          position: absolute;
          right: 6px;
          top: 50%;
          transform: translateY(-50%);
          padding: 4px 8px;
          font-size: 12px;
        "
      >
        Show
      </button>
    </div>

    <div style="position: relative; margin-bottom: 10px">
      <input
        id="confirm-password"
        type="password"
        placeholder="Confirm new password"
        style="
          width: 100%;
          padding: 10px;
          padding-right: 60px;
          box-sizing: border-box;
        "
      />
      <button
        id="toggle-confirm-password"
        type="button"
        style="
          position: absolute;
          right: 6px;
          top: 50%;
          transform: translateY(-50%);
          padding: 4px 8px;
          font-size: 12px;
        "
      >
        Show
      </button>
    </div>

    <button id="submit" style="width: 100%; padding: 10px">
      Update Password
    </button>
    <p id="status"></p>

    <script>
      const supabaseClient = window.supabase.createClient(
        "https://kzuzhcpfaacvfdkkxmep.supabase.co",
        "sb_publishable_fFe1RnAHa42dRlterZYB6w_47viQRxX",
      );

      const statusEl = document.getElementById("status");
      const passwordEl = document.getElementById("password");
      const confirmPasswordEl = document.getElementById("confirm-password");

      function setupToggle(buttonId, inputEl) {
        const button = document.getElementById(buttonId);
        button.onclick = () => {
          const isHidden = inputEl.type === "password";
          inputEl.type = isHidden ? "text" : "password";
          button.innerText = isHidden ? "Hide" : "Show";
        };
      }

      setupToggle("toggle-password", passwordEl);
      setupToggle("toggle-confirm-password", confirmPasswordEl);

      // Supabase JS client auto-detects the recovery token from the URL on load
      // by default (detectSessionInUrl defaults to true for the web client),
      // but we confirm it actually landed:
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          statusEl.innerText = "Ready — enter your new password.";
        }
      });

      supabaseClient.auth.getSession().then(({ data, error }) => {
        if (error)
          statusEl.innerText = "Error loading session: " + error.message;
        if (!data.session)
          statusEl.innerText =
            "No recovery session found — link may be expired.";
      });

      document.getElementById("submit").onclick = async () => {
        const password = passwordEl.value;
        const confirmPassword = confirmPasswordEl.value;

        if (password.length < 6) {
          statusEl.innerText = "Password must be at least 6 characters.";
          return;
        }
        if (password !== confirmPassword) {
          statusEl.innerText = "Passwords don't match.";
          return;
        }

        statusEl.innerText = "Updating...";
        const { error } = await supabaseClient.auth.updateUser({ password });
        statusEl.innerText = error
          ? "Error: " + error.message
          : "Password updated! You can close this page and log in on the app.";
      };
    </script>
  </body>
</html>
